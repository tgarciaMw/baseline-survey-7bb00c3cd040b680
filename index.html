<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Encelium Baseline Survey</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E2220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --ground:#F2F0EC; --panel:#FFFFFF; --panel-2:#E9E6E0;
    --ink:#1C1F1E; --ink-2:#4A524E; --ink-3:#7C857F;
    --line:#D4D0C8; --line-2:#BFBAB0;
    --bus:#3F7A4E; --bus-soft:#E2EDE4; --bus-ink:#2A5637;
    --unknown:#B3761A; --unknown-soft:#F6EBD8;
    --missing:#A33A2C;
    --tap:52px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#141715; --panel:#1E2220; --panel-2:#272C29;
      --ink:#EDEFEC; --ink-2:#AEB5B0; --ink-3:#7E877F;
      --line:#333937; --line-2:#454C48;
      --bus:#6FBF84; --bus-soft:#1E2E23; --bus-ink:#9BD7AA;
      --unknown:#E0A54A; --unknown-soft:#33280F;
      --missing:#E4776A;
    }
  }
  :root[data-theme="dark"]{
    --ground:#141715; --panel:#1E2220; --panel-2:#272C29;
    --ink:#EDEFEC; --ink-2:#AEB5B0; --ink-3:#7E877F;
    --line:#333937; --line-2:#454C48;
    --bus:#6FBF84; --bus-soft:#1E2E23; --bus-ink:#9BD7AA;
    --unknown:#E0A54A; --unknown-soft:#33280F;
    --missing:#E4776A;
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
    display:flex; flex-direction:column; height:100%;
    padding-top:env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box}
  button{font:inherit; color:inherit; cursor:pointer}
  [hidden]{display:none !important}
  img{max-width:100%}
  .mono{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric:tabular-nums}

  header{
    position:sticky; top:0; z-index:30;
    background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px 0;
  }
  .hrow{display:flex; align-items:center; gap:10px}
  .site{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
  .grow{flex:1; min-width:0}
  .iconbtn{
    background:var(--panel-2); border:1px solid var(--line); border-radius:9px;
    width:40px; height:36px; display:grid; place-items:center; flex:none;
  }
  .floors{display:flex; gap:6px; overflow-x:auto; padding:9px 0 8px; scrollbar-width:none}
  .floors::-webkit-scrollbar{display:none}
  .floor{
    flex:none; border:1px solid var(--line); background:transparent; color:var(--ink-2);
    border-radius:999px; padding:6px 13px; font-size:13px; font-weight:600; white-space:nowrap;
  }
  .floor[aria-pressed="true"]{background:var(--ink); color:var(--ground); border-color:var(--ink)}
  .bar{height:3px; background:var(--panel-2); border-radius:2px; overflow:hidden; flex:1}
  .bar i{display:block; height:100%; background:var(--bus); width:0; transition:width .25s ease}
  .barwrap{display:flex; align-items:center; gap:10px; padding-bottom:10px}
  .count{font-size:12px; color:var(--ink-3); font-weight:600; flex:none}

  main{flex:1; overflow-y:auto; padding:16px 16px 20px; -webkit-overflow-scrolling:touch}
  .wrap{max-width:560px; margin:0 auto}
  .roomhead{display:flex; align-items:flex-start; gap:12px; margin-bottom:4px}
  .rnum{font-size:30px; font-weight:600; letter-spacing:-.01em; line-height:1.05}
  .rname{font-size:16px; color:var(--ink-2); font-weight:500; line-height:1.25}
  .chip{
    display:inline-flex; align-items:center; gap:6px; margin-top:8px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink-2);
    border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:600;
  }
  fieldset{border:0; margin:20px 0 0; padding:0}
  legend{padding:0 0 8px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
  .hint{font-size:12.5px; color:var(--ink-3); margin:-4px 0 9px}
  .opts{display:grid; gap:8px}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  .opt{
    min-height:var(--tap); border:1px solid var(--line); background:var(--panel);
    border-radius:11px; padding:10px 12px; text-align:left; display:flex;
    flex-direction:column; justify-content:center; gap:2px; line-height:1.25;
  }
  .opt b{font-weight:600; font-size:14.5px}
  .opt span{font-size:11.5px; color:var(--ink-3)}
  .opt[aria-pressed="true"]{border-color:var(--bus); background:var(--bus-soft); box-shadow:inset 0 0 0 1px var(--bus)}
  .opt[aria-pressed="true"] b{color:var(--bus-ink)}
  .opt.unk[aria-pressed="true"]{border-color:var(--unknown); background:var(--unknown-soft); box-shadow:inset 0 0 0 1px var(--unknown)}
  .opt.unk[aria-pressed="true"] b{color:var(--unknown)}
  .numrow{display:flex; gap:8px; align-items:stretch}
  input[type="number"]{
    flex:1; min-width:0; min-height:var(--tap); border:1px solid var(--line); background:var(--panel);
    color:var(--ink); border-radius:11px; padding:10px 14px; font-size:19px; font-weight:600;
    font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;
  }
  input:focus-visible, .opt:focus-visible, button:focus-visible, textarea:focus-visible{
    outline:2px solid var(--bus); outline-offset:2px;
  }
  .unit{
    flex:none; display:grid; place-items:center; padding:0 13px; border-radius:11px;
    background:var(--panel-2); border:1px solid var(--line); font-size:12px;
    color:var(--ink-3); font-weight:600; text-align:center; line-height:1.2;
  }
  textarea{
    width:100%; min-height:70px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); border-radius:11px; padding:11px 13px; font:inherit; resize:vertical;
  }
  footer{
    position:sticky; bottom:0; z-index:30; background:var(--panel); border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    display:flex; gap:8px; align-items:center;
  }
  .nav{
    min-height:var(--tap); border:1px solid var(--line-2); background:var(--panel);
    border-radius:11px; padding:0 15px; font-weight:600; font-size:14.5px; flex:none;
  }
  .nav.primary{background:var(--ink); color:var(--ground); border-color:var(--ink); flex:1}
  .nav.ghost{flex:1; font-size:13.5px}
  .nav:disabled{opacity:.36}
  .scrim{position:fixed; inset:0; background:rgba(10,12,11,.5); z-index:40; border:0; padding:0; width:100%}
  .drawer{
    position:fixed; z-index:41; top:0; right:0; bottom:0; width:min(86%, 380px);
    background:var(--ground); border-left:1px solid var(--line); display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .dhead{padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; background:var(--panel)}
  .dlist{flex:1; overflow-y:auto; padding:8px 10px 16px}
  .rrow{
    width:100%; display:flex; align-items:center; gap:11px; padding:11px 10px;
    background:transparent; border:0; border-bottom:1px solid var(--line); text-align:left;
  }
  .rrow[aria-current="true"]{background:var(--panel-2); border-radius:9px; border-bottom-color:transparent}
  .dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--line-2)}
  .dot.done{background:var(--bus)}
  .dot.part{background:var(--unknown)}
  .rrow .n{font-weight:600; font-size:14px; flex:none; min-width:58px}
  .rrow .t{font-size:13px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sheet{
    position:fixed; z-index:41; left:0; right:0; bottom:0; max-height:88%;
    background:var(--ground); border-top:1px solid var(--line); border-radius:16px 16px 0 0;
    display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .sbody{overflow-y:auto; padding:18px 16px 22px}
  .sbody h2{margin:0 0 3px; font-size:18px}
  .sbody p{margin:0 0 15px; color:var(--ink-2); font-size:13.5px}
  .stat{display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px}
  .stat b{font-weight:600}
  .warn{margin:14px 0 0; padding:11px 13px; border-radius:10px; font-size:13px; line-height:1.4;
    background:var(--unknown-soft); border:1px solid var(--unknown); color:var(--ink)}
  .warn.ok{background:var(--bus-soft); border-color:var(--bus)}
  .big{
    width:100%; min-height:var(--tap); border-radius:11px; border:1px solid var(--ink);
    background:var(--ink); color:var(--ground); font-weight:600; font-size:15px; margin-top:14px;
  }
  .big.sec{background:transparent; color:var(--ink); border-color:var(--line-2)}
  label.fld{display:block; font-size:12px; color:var(--ink-3); font-weight:600; margin:14px 0 6px; letter-spacing:.04em; text-transform:uppercase}
  input[type="text"]{
    width:100%; min-height:46px; border:1px solid var(--line); background:var(--panel);
    color:var(--ink); border-radius:11px; padding:9px 13px; font:inherit;
  }
  .chip.needchip{border-color:var(--unknown); background:var(--unknown-soft); color:var(--ink)}
  .chip.okchip{border-color:var(--bus); background:var(--bus-soft); color:var(--bus-ink)}
  .fxrow{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid var(--line); background:var(--panel); border-radius:11px;
  }
  .fxlab{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25}
  .fxlab b{font-size:15px; font-weight:600}
  .fxlab span{font-size:11.5px; color:var(--ink-3)}
  .ctr{display:flex; align-items:center; gap:2px; flex:none}
  .step{
    width:40px; height:40px; border:1px solid var(--line-2); background:var(--panel-2);
    border-radius:9px; font-size:19px; font-weight:600; line-height:1; display:grid; place-items:center;
  }
  .ctr .num{min-width:34px; text-align:center; font-size:17px; font-weight:600}
  .wcell{
    flex:none; width:92px; min-height:44px; border:1px solid var(--line); background:var(--ground);
    color:var(--ink); border-radius:9px; padding:8px 10px; font-size:16px; font-weight:600;
    text-align:right; font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;
  }
  .total{
    margin-top:10px; padding:10px 13px; border-radius:10px; background:var(--bus-soft);
    border:1px solid var(--bus); font-size:14px; color:var(--ink);
  }
  .total b{font-size:17px; font-weight:600}
  .total.unkline{background:var(--unknown-soft); border-color:var(--unknown)}
  .csvout{width:100%; min-height:170px; font-family:'IBM Plex Mono', monospace; font-size:11px; white-space:pre}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="grow">
      <div class="site">Vanderbilt Recreation Center</div>
      <div style="font-size:15px;font-weight:600">Encelium Baseline Survey</div>
    </div>
    <button class="iconbtn" id="btn-setup" aria-label="Export and settings" title="Export">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
    </button>
    <button class="iconbtn" id="btn-rooms" aria-label="Room list" title="Rooms">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <div class="floors" id="floors"></div>
  <div class="barwrap">
    <div class="bar"><i id="bar"></i></div>
    <div class="count" id="count">0 / 0</div>
  </div>
</header>

<main><div class="wrap" id="wrap"></div></main>

<footer>
  <button class="nav" id="btn-prev" aria-label="Previous room">&larr;</button>
  <button class="nav ghost" id="btn-same">Same as last</button>
  <button class="nav primary" id="btn-next">Next room &rarr;</button>
</footer>

<script>
(function(){
  "use strict";

  // Seed rooms read off the Encelium as-builts, sheets E1-C (first floor) and
  // E2-B (second floor), Vanderbilt Recreation Center, rev 03-20-13. Partial --
  // replace wholesale when the full drawing set arrives.
  var SEED = [
    ["1","100A","Vestibule"],["1","100B","Lobby / Prefunction"],["1","100C","Corridor"],
    ["1","100CA","Corridor"],["1","100CB","Corridor"],["1","100D","Exit Lobby"],
    ["1","100L","Lobby"],["1","100LA","Vestibule"],["1","101A","Control Desk"],
    ["1","101B","Control"],["1","102","Gymnasium"],["1","102A","Storage"],
    ["1","102B","Storage"],["1","104A","Electrical"],["1","104D","M Faculty Lockers"],
    ["1","107","Janitor"],["1","108","Weight / Exercise"],["1","108A","Storage"],
    ["1","108F","W Faculty Lockers"],["1","109","Elevator Machine"],["1","110","Janitor"],
    ["1","111","Corridor"],["1","112AA","Storage"],["1","112C","Equipment Storage"],
    ["1","112D","Equipment Storage"],["1","112E","Equipment Storage"],["1","112F","Equipment Storage"],
    ["1","112G","Equipment Storage"],["1","112H","Equipment Storage"],["1","113","Laundry"],
    ["1","114","Racquetball"],["1","115","Racquetball"],["1","116","Racquetball"],
    ["1","117","Racquetball"],["1","118","Bowling"],["1","118A","Bowling Equipment"],
    ["1","119A","Services / Receiving"],["1","119D","Storage"],["1","120","Lounge"],
    ["1","120A","Vestibule"],["1","121","Wellness"],["1","122","Men's Toilet"],
    ["1","123","Women's Toilet"],["1","124","Janitor"],["1","127","Reception"],
    ["1","127A","Office"],["1","127B","Office"],["1","127C","Storage"],["1","127D","Office"],
    ["1","127E","Office"],["1","127F","Conference Room"],["1","128","Storage"],
    ["1","130","Multipurpose Room"],["1","131","Control"],["1","131A","Closet"],
    ["1","132","Men's Toilet"],["1","133","Women's Toilet"],["1","134","Janitor"],
    ["1","135","Storage"],["1","136","Training"],["1","137","Storage / Golf Sim"],
    ["1","138","Training"],["1","139A","Storage"],["1","146","Family Locker"],
    ["1","146B","H.C. Changing"],["1","146C","H.C. Changing"],["1","149","HP Storage"],
    ["1","150","Weights"],["1","150A","Storage"],["1","151","Weights"],
    ["1","100SB","Stair"],["1","100SC","Stair"],["1","100SE","Stair"],
    ["2","200","Main Corridor"],["2","200C","Corridor"],["2","200D","Elevator"],
    ["2","204A","Storage"],["2","205","Janitor"],["2","207","Mechanical"],
    ["2","208","Corridor"],["2","209","Men Locker"],["2","210","Women Locker"],
    ["2","211","Vestibule"],["2","212","Vestibule"],["2","213","Women's Toilet"],
    ["2","214","Men's Toilet"],["2","216","Squash Court 1"],["2","217","Squash Court 2"],
    ["2","227A","Connector"],["2","229","Multipurpose"],["2","235","Overlook"],
    ["2","236","Mechanical"],["2","236A","Electrical"],["2","237","Multipurpose"],
    ["2","237A","Storage"],["2","240","Corridor"],["2","250B","Multipurpose"],
    ["2","251","Multipurpose"],["2","251A","Storage"],["2","252","Corridor"],
    ["2","200SC","Stair"]
  ];

  var TYPES = {
    "Corridor":168, "Stairwell":168, "Gymnasium":105, "Court":98, "Weight / fitness":105,
    "Office":55, "Conference":50, "Reception":55, "Multipurpose":70, "Training":70,
    "Locker room":112, "Restroom":112, "Lobby":119, "Storage":20, "Mechanical / electrical":10,
    "Janitor":20, "Service":60, "Other":55
  };
  function guessType(name){
    var n = name.toLowerCase();
    if(/stair/.test(n)) return "Stairwell";
    if(/corridor|vestibule|connector/.test(n)) return "Corridor";
    if(/gymnasium/.test(n)) return "Gymnasium";
    if(/racquetball|squash|bowling/.test(n)) return "Court";
    if(/weight|exercise|wellness/.test(n)) return "Weight / fitness";
    if(/conference/.test(n)) return "Conference";
    if(/reception|control desk/.test(n)) return "Reception";
    if(/office|control/.test(n)) return "Office";
    if(/multipurpose|overlook/.test(n)) return "Multipurpose";
    if(/training/.test(n)) return "Training";
    if(/locker|changing/.test(n)) return "Locker room";
    if(/toilet/.test(n)) return "Restroom";
    if(/lobby|lounge/.test(n)) return "Lobby";
    if(/janitor/.test(n)) return "Janitor";
    if(/mechanical|electrical|elevator|closet/.test(n)) return "Mechanical / electrical";
    if(/storage/.test(n)) return "Storage";
    if(/laundry|services|receiving/.test(n)) return "Service";
    return "Other";
  }

  var SENSORS = [
    {v:"none",     t:"None",            s:"No occupancy sensor"},
    {v:"SCP-0456", t:"PIR ceiling",     s:"SCP-0456 / SCP-1500"},
    {v:"SCM-0500", t:"Multi-tech",      s:"SCM-0500 / 1000 / 2000"},
    {v:"wall",     t:"Wall + override", s:"SW-UB-24 / PV-UB-24"},
    {v:"unknown",  t:"Can't tell",      s:"Flag for follow-up", unk:true}
  ];
  var SCENARIOS = [
    {v:"controls_only",        t:"Controls only",         s:"Fixtures stay"},
    {v:"fixture_and_controls", t:"Fixture + controls",    s:"Both change"},
    {v:"fixture_new_controls", t:"Fixture, new controls", s:"No controls before"}
  ];
  var YNU = [{v:"yes",t:"Yes"},{v:"no",t:"No"},{v:"unknown",t:"Can't tell",unk:true}];

  var KEY = "vurec-survey-v1";
  var rooms = SEED.map(function(r){ return {floor:r[0], num:r[1], name:r[2], type:guessType(r[2])}; });
  var data = {}, meta = {by:"", lastExport:null};
  var ftypes = {};   // code -> {size, watts}        shared across all rooms
  var bhours = {};   // room type -> hours per week, filled after the survey
  var idx = 0, floor = "1";

  function store(){
    try{ localStorage.setItem(KEY, JSON.stringify({data:data, meta:meta, ftypes:ftypes, bhours:bhours})); }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var o = JSON.parse(raw); data = o.data || {}; ftypes = o.ftypes || {}; bhours = o.bhours || {};
        if(o.meta){ meta.by = o.meta.by || ""; meta.lastExport = o.meta.lastExport || null; } }
    }catch(e){ data = {}; }
  }
  function rec(num){
    if(!data[num]){
      var r = rooms.filter(function(x){return x.num===num;})[0];
      data[num] = {scenario:null, fixtures:[], wattsUnknown:false, dimmable:null,
                   sensor:null, photocell:null, burnOverride:null, notes:"",
                   type:(r ? r.type : "Other"), typeConfirmed:false, ts:null};
    }
    return data[num];
  }
  function touched(num){
    var d = data[num]; if(!d) return 0;
    var n = 0;
    if(d.scenario) n++;
    if((d.fixtures && d.fixtures.length) || d.wattsUnknown) n++;
    if(d.dimmable) n++;
    if(d.sensor) n++;
    if(d.photocell) n++;
    if(d.typeConfirmed) n++;
    return n;
  }
  function complete(num){ return touched(num) >= 6; }
  function inFloor(){ return rooms.filter(function(r){ return r.floor === floor; }); }
  function save(num){ var d = data[num]; if(d) d.ts = new Date().toISOString(); store(); }

  function opt(o, cur, on){
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt" + (o.unk ? " unk" : "");
    b.setAttribute("aria-pressed", String(cur === o.v));
    var t = document.createElement("b"); t.textContent = o.t; b.appendChild(t);
    if(o.s){ var s = document.createElement("span"); s.textContent = o.s; b.appendChild(s); }
    b.addEventListener("click", function(){ on(cur === o.v ? null : o.v); });
    return b;
  }
  function group(legend, hint, opts, cur, cls, on){
    var fs = document.createElement("fieldset");
    var lg = document.createElement("legend"); lg.textContent = legend; fs.appendChild(lg);
    if(hint){ var h = document.createElement("div"); h.className = "hint"; h.textContent = hint; fs.appendChild(h); }
    var g = document.createElement("div"); g.className = "opts " + cls;
    opts.forEach(function(o){ g.appendChild(opt(o, cur, on)); });
    fs.appendChild(g); return fs;
  }

  function render(){
    var list = inFloor();
    if(idx >= list.length) idx = 0;
    var room = list[idx], d = rec(room.num);
    var wrap = document.getElementById("wrap");
    wrap.innerHTML = "";

    var head = document.createElement("div"); head.className = "roomhead";
    var left = document.createElement("div");
    var num = document.createElement("div"); num.className = "rnum mono"; num.textContent = room.num;
    var nm = document.createElement("div"); nm.className = "rname"; nm.textContent = room.name;
    left.appendChild(num); left.appendChild(nm); head.appendChild(left);
    wrap.appendChild(head);

    var chip = document.createElement("button");
    chip.className = "chip" + (d.typeConfirmed ? " okchip" : " needchip");
    chip.type = "button";

  // ---- fixture types -------------------------------------------------------
  var SIZES = ["2x4 troffer","2x2 troffer","1x4 troffer","1x4 strip","8ft strip",
               "Round can / downlight","Square downlight","Linear pendant",
               "High bay","Wall pack","Sconce","Track","Exit / emergency","Other"];

  function roomWatts(num){
    var d = data[num]; if(!d || !d.fixtures || !d.fixtures.length) return null;
    var total = 0, known = true;
    d.fixtures.forEach(function(fx){
      var t = ftypes[fx.code];
      if(!t || t.watts === null || t.watts === undefined || t.watts === "") known = false;
      else total += Number(t.watts) * fx.count;
    });
    return known ? total : null;
  }
  function typesUsed(){
    var used = {};
    Object.keys(data).forEach(function(num){
      (data[num].fixtures || []).forEach(function(fx){ used[fx.code] = (used[fx.code]||0) + fx.count; });
    });
    return used;
  }

      var g = document.createElement("div"); g.className = "opts";

  // ---- room type + burn hours ---------------------------------------------
  function roomBurn(num){
    var d = data[num]; if(!d) return null;
    if(d.burnOverride !== null && d.burnOverride !== undefined) return d.burnOverride;
    var v = bhours[d.type];
    return (v === undefined || v === null || v === "") ? null : Number(v);
  }
  function roomTypesInUse(){
    var used = {};
    rooms.forEach(function(r){
      var d = data[r.num];
      if(d && d.typeConfirmed) used[d.type] = (used[d.type] || 0) + 1;
    });
    return used;
  }
  function roomTypesNeedingHours(){
    var used = roomTypesInUse();
    return Object.keys(used).filter(function(t){
      var v = bhours[t];
      return v === undefined || v === null || v === "";
    });
  }

    var scrim = document.createElement("button");

  function csv(){
    var head = ["building","floor","room_number","room_name","space_type","scenario",
                "existing_connected_w","watts_unknown","fixtures","existing_dimmable","existing_occ_model",
                "existing_had_photocell","assumed_burn_hours_wk","burn_hours_source",
                "room_type_confirmed","notes","surveyed_by","surveyed_ts"];
    var out = [head.join(",")];
    rooms.forEach(function(r){
      var d = data[r.num];
      if(!d || touched(r.num) === 0) return;
      var w = roomWatts(r.num);
      var bh = roomBurn(r.num);
      var fx = (d.fixtures || []).map(function(f){ return f.code + ":" + f.count; }).join("|");
      var row = ["Vanderbilt Recreation Center", r.floor, r.num, r.name, d.type,
                 d.scenario || "", d.wattsUnknown ? "" : (w === null ? "" : w),
                 d.wattsUnknown ? "true" : "", fx, d.dimmable || "", d.sensor || "",
                 d.photocell || "", bh === null ? "" : bh,
                 bh === null ? "pending" : (d.burnOverride !== null ? "room override" : "room type table"),
                 d.typeConfirmed ? "yes" : "inferred",
                 d.notes || "", meta.by || "", d.ts || ""];
      out.push(row.map(function(v){
        v = String(v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(","));
    });
    return out.join("\n");
  }

  function fixtureCsv(){
    var used = typesUsed();
    var out = ["fixture_code,nominal_size,watts_each,count_surveyed"];
    Object.keys(ftypes).sort().forEach(function(c){
      var t = ftypes[c];
      var row = [c, t.size || "", (t.watts === null || t.watts === undefined) ? "" : t.watts, used[c] || 0];
      out.push(row.map(function(v){
        v = String(v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(","));
    });
    return out.join("\n");
  }

  function burnCsv(){
    var used = roomTypesInUse();
    var out = ["room_type,burn_hours_per_week,rooms_of_this_type,suggested_default"];
    Object.keys(used).sort().forEach(function(t){
      var v = bhours[t];
      out.push([t, (v === undefined || v === null) ? "" : v, used[t], TYPES[t] || ""].join(","));
    });
    return out.join("\n");
  }

  function openSheet(){
    var scrim = document.createElement("button");
    scrim.className = "scrim"; scrim.setAttribute("aria-label", "Close");
    var sh = document.createElement("div");
    sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-label", "Export");
    var body = document.createElement("div"); body.className = "sbody";

    var captured = rooms.filter(function(r){ return touched(r.num) > 0; }).length;
    var doneN = rooms.filter(function(r){ return complete(r.num); }).length;
    var unknowns = rooms.filter(function(r){
      var d = data[r.num]; if(!d) return false;
      return d.wattsUnknown || d.dimmable === "unknown" || d.sensor === "unknown" || d.photocell === "unknown";
    }).length;

    var h2 = document.createElement("h2"); h2.textContent = "Send survey";
    var p = document.createElement("p"); p.textContent = "The CSV loads straight into mwLink - no retyping.";
    body.appendChild(h2); body.appendChild(p);
    var needHours = roomTypesNeedingHours();
    var tcodes = Object.keys(ftypes);
    var needWatts = tcodes.filter(function(c){
      return ftypes[c].watts === null || ftypes[c].watts === undefined;
    });
    [["Rooms complete", doneN + " of " + rooms.length],
     ["Rooms started", String(captured)],
     ["Rooms with a “can’t tell”", String(unknowns)],
     ["Fixture types", tcodes.length + (needWatts.length ? " (" + needWatts.length + " need watts)" : "")],
     ["Room types needing hours", String(needHours.length)]
    ].forEach(function(pair){
      var s = document.createElement("div"); s.className = "stat";
      var a = document.createElement("span"); a.textContent = pair[0];
      var b = document.createElement("b"); b.textContent = pair[1];
      s.appendChild(a); s.appendChild(b); body.appendChild(s);
    });

    var warn = document.createElement("div");
    warn.className = "warn" + (meta.lastExport ? " ok" : "");
    warn.textContent = meta.lastExport
      ? "Last sent " + new Date(meta.lastExport).toLocaleString() + "."
      : "Not sent yet. Send at the end of every floor - phone storage can be cleared, and this data cannot be re-collected once fixtures come out.";
    body.appendChild(warn);

    var lb = document.createElement("label"); lb.className = "fld"; lb.textContent = "Surveyor";
    lb.setAttribute("for", "byname");
    var by = document.createElement("input");
    by.type = "text"; by.id = "byname"; by.placeholder = "Initials or name"; by.value = meta.by || "";
    by.addEventListener("input", function(){ meta.by = by.value; store(); });
    body.appendChild(lb); body.appendChild(by);

    var name = "vurec-survey-" + new Date().toISOString().slice(0,10) + ".csv";

    if(navigator.share){
      var bs = document.createElement("button");
      bs.className = "big"; bs.textContent = "Send by email or Teams";
      bs.addEventListener("click", function(){
        var file = new File([csv()], name, {type:"text/csv"});
        var ffile = new File([fixtureCsv()],
          "vurec-fixture-types-" + new Date().toISOString().slice(0,10) + ".csv", {type:"text/csv"});
        var bfile = new File([burnCsv()],
          "vurec-burn-hours-" + new Date().toISOString().slice(0,10) + ".csv", {type:"text/csv"});
        var payload = (navigator.canShare && navigator.canShare({files:[file, ffile, bfile]}))
          ? {files:[file, ffile, bfile], title:"Encelium baseline survey"}
          : ((navigator.canShare && navigator.canShare({files:[file]}))
              ? {files:[file], title:"Encelium baseline survey"}
              : {title:"Encelium baseline survey", text:csv()});
        navigator.share(payload).then(function(){ markSent(warn); }).catch(function(){});
      });
      body.appendChild(bs);
    }

    if(needWatts.length){
      var wt = document.createElement("div"); wt.className = "warn";
      wt.textContent = "Wattage missing for " + needWatts.join(", ") +
        ". Those rooms export with a blank total until the fixture table is filled.";
      body.appendChild(wt);
      var ot = document.createElement("button");
      ot.className = "big sec"; ot.textContent = "Open fixture table";
      ot.addEventListener("click", function(){ close(); openTypes(); });
      body.appendChild(ot);
    }

    var bd = document.createElement("a");
    bd.className = "big sec"; bd.textContent = "Download rooms CSV";
    bd.style.display = "block"; bd.style.textAlign = "center"; bd.style.lineHeight = "52px";
    bd.style.textDecoration = "none";
    bd.href = URL.createObjectURL(new Blob([csv()], {type:"text/csv"}));
    bd.download = name;
    bd.addEventListener("click", function(){ setTimeout(function(){ markSent(warn); }, 400); });
    body.appendChild(bd);

    if(needHours.length){
      var bw = document.createElement("div"); bw.className = "warn";
      bw.textContent = "No burn hours yet for " + needHours.join(", ") +
        ". Those rooms export with a blank figure until the table is filled.";
      body.appendChild(bw);
      var ob = document.createElement("button");
      ob.className = "big sec"; ob.textContent = "Open burn hours table";
      ob.addEventListener("click", function(){ close(); openBurnTable(); });
      body.appendChild(ob);
    }

    var bh2 = document.createElement("a");
    bh2.className = "big sec"; bh2.textContent = "Download burn hours CSV";
    bh2.style.display = "block"; bh2.style.textAlign = "center"; bh2.style.lineHeight = "52px";
    bh2.style.textDecoration = "none";
    bh2.href = URL.createObjectURL(new Blob([burnCsv()], {type:"text/csv"}));
    bh2.download = "vurec-burn-hours-" + new Date().toISOString().slice(0,10) + ".csv";
    body.appendChild(bh2);

    var bf = document.createElement("a");
    bf.className = "big sec"; bf.textContent = "Download fixture table CSV";
    bf.style.display = "block"; bf.style.textAlign = "center"; bf.style.lineHeight = "52px";
    bf.style.textDecoration = "none";
    bf.href = URL.createObjectURL(new Blob([fixtureCsv()], {type:"text/csv"}));
    bf.download = "vurec-fixture-types-" + new Date().toISOString().slice(0,10) + ".csv";
    body.appendChild(bf);

    var b2 = document.createElement("button");
    b2.className = "big sec"; b2.textContent = "Show CSV to copy";
    b2.addEventListener("click", function(){
      var ta = document.createElement("textarea");
      ta.className = "csvout"; ta.readOnly = true; ta.value = csv(); ta.style.marginTop = "12px";
      b2.replaceWith(ta); ta.focus(); ta.select();
    });
    body.appendChild(b2);

    sh.appendChild(body);
    document.body.appendChild(scrim); document.body.appendChild(sh);
    function close(){ scrim.remove(); sh.remove(); }
    scrim.addEventListener("click", close);
  }
  function markSent(warn){
    meta.lastExport = Date.now(); store();
    warn.className = "warn ok";
    warn.textContent = "Last sent " + new Date(meta.lastExport).toLocaleString() + ".";
  }

  document.getElementById("btn-rooms").addEventListener("click", openDrawer);
  document.getElementById("btn-setup").addEventListener("click", openSheet);
  document.getElementById("btn-prev").addEventListener("click", function(){
    if(idx > 0){ idx--; render(); document.querySelector("main").scrollTop = 0; }
  });
  document.getElementById("btn-next").addEventListener("click", function(){
    if(idx < inFloor().length - 1){ idx++; render(); document.querySelector("main").scrollTop = 0; }
  });
  document.getElementById("btn-same").addEventListener("click", function(){
    var list = inFloor();
    if(idx === 0) return;
    var prev = data[list[idx-1].num]; if(!prev) return;
    var cur = rec(list[idx].num);
    cur.scenario = prev.scenario; cur.wattsUnknown = prev.wattsUnknown;
    cur.fixtures = (prev.fixtures || []).map(function(f){ return {code:f.code, count:f.count}; });
    cur.dimmable = prev.dimmable; cur.sensor = prev.sensor; cur.photocell = prev.photocell;
    cur.burnOverride = prev.burnOverride;
    cur.type = prev.type; cur.typeConfirmed = prev.typeConfirmed;
    save(list[idx].num); render();
  });

  load(); paintFloors(); render();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
